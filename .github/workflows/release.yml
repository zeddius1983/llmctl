name: Release

# Create the GitHub Release for a pushed `v*` tag, then build prebuilt Linux
# binaries and attach them to it. Can also be run manually from the Actions tab
# against an existing tag (use the ref selector) to (re)produce its artifacts;
# this recreates the release, but the notes come from a checked-in file, so a
# re-run reproduces them rather than losing hand-edited text.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          title: llmctl $tag
          # Release notes come from the per-release doc, so the release page and
          # the repo cannot drift. `$tag` interpolates to e.g. `v0.4.0`.
          #
          # The action runs `parse-changelog <file> <version>` on it, which
          # needs the H1 to parse as a version under parse-changelog's default
          # prefix format — `# v0.4.0 — title` does, `# llmctl v0.4.0 — title`
          # does not. The action exposes no way to override that prefix, so the
          # heading convention is load-bearing. Everything below the H1 becomes
          # the release body.
          changelog: docs/release-notes-$tag.md
          # Tags before v0.4.0 predate this convention: their checked-out docs
          # still carry the old `# llmctl vX.Y.Z` heading, which will not parse.
          # Without this, re-running the workflow against one of them to rebuild
          # its artifacts would fail outright instead of just omitting notes.
          allow-missing-changelog: true
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # Dynamically linked against the host glibc.
          - x86_64-unknown-linux-gnu
          # Fully static, no glibc version dependency — runs on any Linux.
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - name: Build and upload ${{ matrix.target }}
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: llmctl
          target: ${{ matrix.target }}
          # Archive name, e.g. llmctl-v0.1.0-x86_64-unknown-linux-musl.tar.gz
          archive: $bin-$tag-$target
          tar: unix
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
